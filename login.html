<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }
        .dark .glass-card {
            background: rgba(26, 15, 8, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .glass-input {
            background: rgba(255, 248, 245, 0.8);
            border: 1px solid rgba(131, 116, 109, 0.2);
            transition: all 0.3s ease;
        }
        .dark .glass-input {
            background: rgba(26, 15, 8, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffede4;
        }
        .glass-input:focus {
            background: rgba(255, 248, 245, 1);
            border-color: #ffa535;
            box-shadow: inset 0 0 5px rgba(255, 165, 53, 0.2);
            outline: none;
        }
        .dark .glass-input:focus {
            background: rgba(26, 15, 8, 0.9);
            border-color: #ffa535;
        }
        .toggle-container {
            position: relative;
            width: 100%;
            perspective: 1000px;
        }
        .flipper {
            display: grid;
            width: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flipper.flipped {
            transform: rotateY(180deg);
        }
        .front, .back {
            grid-area: 1 / 1;
            width: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .back {
            transform: rotateY(180deg);
        }
        
        .theme-toggle-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #3d1f0d;
        }
        .dark .theme-toggle-btn {
            background: rgba(26, 15, 8, 0.4);
            border-color: rgba(255, 255, 255, 0.1);
            color: #efbba0;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.3);
        }
        .dark .theme-toggle-btn:hover {
            background: rgba(26, 15, 8, 0.6);
        }

    </style>

<body class="bg-background dark:bg-[#1a0f08] text-on-background dark:text-[#ffede4] min-h-screen flex items-center justify-center relative transition-colors duration-500">

<div class="fixed inset-0 bg-primary/20 dark:bg-black/60 mix-blend-multiply z-0 transition-colors duration-500"></div>



<!-- Toggles Container -->
<div class="top-right-container">

    <button class="theme-btn" id="theme-toggle-btn" aria-label="Toggle Dark Mode">

<main class="relative z-10 w-full max-w-[480px] px-margin-safe py-20 min-h-[650px] flex flex-col">
<div class="toggle-container fade-in flex-1">
<div class="flipper" id="cardFlipper">
<!-- Front: Login -->
<div class="front">
<div class="glass-card rounded-xl p-8 flex flex-col h-full shadow-[0_4px_16px_rgba(61,31,13,0.1)] dark:shadow-[0_4px_24px_rgba(0,0,0,0.5)]">
<div class="text-center mb-stack-lg">
<span class="material-symbols-outlined text-[48px] text-primary-container dark:text-inverse-primary mb-stack-sm transition-colors duration-300" data-icon="menu_book">menu_book</span>
<h1 class="font-headline-lg text-headline-lg text-primary-container dark:text-inverse-primary transition-colors duration-300">Book Haven</h1>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant mt-stack-sm transition-colors duration-300">Welcome back to the library.</p>
</div>
<form class="flex-grow flex flex-col gap-stack-md justify-center">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant mb-2 transition-colors duration-300" for="login-email">Email Address</label>
<input class="glass-input w-full rounded font-body-md text-body-md p-3 placeholder-outline-variant dark:placeholder-outline/60" id="login-email" placeholder="reader@example.com" type="email"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant mb-2 flex justify-between transition-colors duration-300" for="login-password">
<span>Password</span>
<a class="text-secondary dark:text-secondary-fixed hover:text-secondary-container dark:hover:text-secondary-fixed-dim transition-colors" href="#">Forgot?</a>
</label>
<input class="glass-input w-full rounded font-body-md text-body-md p-3 placeholder-outline-variant dark:placeholder-outline/60" id="login-password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full bg-primary-container dark:bg-inverse-primary text-on-primary dark:text-primary rounded-lg py-3 mt-stack-sm font-label-sm text-label-sm hover:bg-primary dark:hover:brightness-110 transition-colors flex items-center justify-center gap-2 group" type="button">
                                Enter Library
                                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-stack-lg text-center font-body-md text-body-md text-on-surface-variant dark:text-outline-variant transition-colors duration-300">
                            New to the club? 
                            <button class="text-secondary dark:text-secondary-fixed hover:text-secondary-container dark:hover:text-secondary-fixed-dim font-label-sm text-label-sm underline underline-offset-4 transition-colors" onclick="toggleCard()">Apply for Membership</button>
</div>
</div>
</div>
<!-- Back: Register -->
<div class="back">
<div class="glass-card rounded-xl p-8 flex flex-col h-full shadow-[0_4px_16px_rgba(61,31,13,0.1)] dark:shadow-[0_4px_24px_rgba(0,0,0,0.5)]">
<div class="text-center mb-stack-lg">
<span class="material-symbols-outlined text-[48px] text-primary-container dark:text-inverse-primary mb-stack-sm transition-colors duration-300" data-icon="auto_stories">auto_stories</span>
<h2 class="font-headline-md text-headline-md text-primary-container dark:text-inverse-primary transition-colors duration-300">Join the Club</h2>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant mt-2 transition-colors duration-300">Begin your slow reading journey.</p>
</div>
<form class="flex-grow flex flex-col gap-stack-md justify-center">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant mb-2 transition-colors duration-300" for="reg-name">Preferred Name</label>
<input class="glass-input w-full rounded font-body-md text-body-md p-3 placeholder-outline-variant dark:placeholder-outline/60" id="reg-name" placeholder="Jane Austen" type="text"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant mb-2 transition-colors duration-300" for="reg-email">Email Address</label>
<input class="glass-input w-full rounded font-body-md text-body-md p-3 placeholder-outline-variant dark:placeholder-outline/60" id="reg-email" placeholder="jane@example.com" type="email"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant mb-2 transition-colors duration-300" for="reg-genre">Favorite Genre</label>
<select class="glass-input w-full rounded font-body-md text-body-md p-3 appearance-none dark:text-[#ffede4] dark:bg-[#1a0f08]" id="reg-genre">
<option disabled="" selected="" value="">Select a genre...</option>
<option value="fiction">Literary Fiction</option>
<option value="nonfiction">Historical Non-Fiction</option>
<option value="poetry">Poetry</option>
<option value="philosophy">Philosophy</option>
</select>
</div>
<button class="w-full bg-secondary-container dark:bg-secondary-fixed text-on-secondary-fixed dark:text-secondary rounded-lg py-3 mt-stack-sm font-label-sm text-label-sm hover:brightness-105 transition-all shadow-sm" type="button">
                                Submit Application
                            </button>
</form>
<div class="mt-stack-lg text-center font-body-md text-body-md text-on-surface-variant dark:text-outline-variant transition-colors duration-300">
                            Already a member? 
                            <button class="text-secondary dark:text-secondary-fixed hover:text-secondary-container dark:hover:text-secondary-fixed-dim font-label-sm text-label-sm underline underline-offset-4 transition-colors" onclick="toggleCard()">Return to Login</button>
</div>
</div>
</div>
</div>
</div>
</div>
</main>

<script>
    function toggleCard() {
        document.getElementById('cardFlipper').classList.toggle('flipped');
    }

    document.getElementById('theme-toggle-btn').addEventListener('click', function() {
        if (document.documentElement.classList.contains('dark')) {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            localStorage.setItem('theme', 'dark');
        }
    });

    // Apply saved theme on load
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
    }
</script>

</body></html>
